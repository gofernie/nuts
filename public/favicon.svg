    <rect x="162" y="120" width="150" height="46" rx="10"></rect>
    <rect x="162" y="230" width="120" height="46" rx="10"></rect>
    <!-- H -->
    <rect x="332" y="120" width="52" height="272" rx="10"></rect>
    <rect x="424" y="120" width="52" height="272" rx="10"></rect>
    <rect x="332" y="230" width="144" height="46" rx="10"></rect>
